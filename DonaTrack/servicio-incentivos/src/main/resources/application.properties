# Puerto del Servicio de Incentivos
server.port=8082

# Base URL usada para construir los enlaces de las insignias
app.base-url=${APP_BASE_URL:http://localhost:8082}

# Webhook de n8n para la difusión de insignias en redes sociales
n8n.webhook.url=${N8N_WEBHOOK_URL:https://n8n-production-64d0.up.railway.app/webhook/insignia-ganada}

# Base H2 en memoria con nombre fijo, para poder inspeccionarla desde la consola durante la demo.
spring.datasource.url=jdbc:h2:mem:incentivos;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=true

# Explicito para que nadie lo apague "para sacar el warning": las colecciones del donante son
# LAZY y la serializacion de las respuestas las recorre.
spring.jpa.open-in-view=true
