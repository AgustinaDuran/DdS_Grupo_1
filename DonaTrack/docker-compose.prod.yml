# Despliegue COMPLETO del backend de DonaTrack (todos los servicios + infraestructura) en un solo servidor.
#
# En tu máquina (construir y subir las imágenes a Docker Hub):
#   docker login
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml push
#
# En el servidor (sólo hacen falta este archivo, Caddyfile, db/init/ y el .env; no el código):
#   cp .env.prod.example .env        # y completar los valores
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --no-build
#
# Sólo se publican los puertos 80/443 (Caddy). Bases, RabbitMQ y servicios quedan en la red interna;
# Caddy enruta por path a cada servicio y saca el certificado HTTPS solo.
# Memoria estimada: ~2.5 GB en total -> servidor de 4 GB (o 2 GB + swap).

services:
  # --- Reverse proxy con HTTPS automático (Let's Encrypt) ---
  caddy:
    image: caddy:2
    container_name: donatrack-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - servicio-donaciones
      - servicio-notificaciones
      - servicio-incentivos
      - servicio-logistica
      - servicio-logistica-mock

  # --- Infraestructura ---
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: donatrack-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: mysql:8.0
    container_name: donatrack-db
    restart: unless-stopped
    # Recorta el consumo de memoria de MySQL (por defecto ronda los 400+ MB)
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=128M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 20

  mongo:
    image: mongo:7
    container_name: donatrack-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  # --- Servicios ---
  servicio-donaciones:
    build:
      context: .
      dockerfile: ./servicio-donaciones/Dockerfile
    image: ${DOCKERHUB_USER}/donatrack-donaciones:latest
    platform: linux/amd64
    container_name: api-donaciones
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/donaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: donaciones
      SPRING_DATASOURCE_PASSWORD: donaciones
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVICES_NOTIFICACIONES_URL: http://servicio-notificaciones:8081
      SERVICES_INCENTIVOS_URL: http://servicio-incentivos:8082
      SERVICES_LOGISTICA_URL: http://servicio-logistica:8083
      SERVICES_LOGISTICA_MOCK_URL: http://servicio-logistica-mock:8088
      LOGISTICA_MAPA_URL: ${PUBLIC_URL}/mapa
      JAVA_TOOL_OPTIONS: -Xmx320m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-notificaciones:
        condition: service_started
      servicio-incentivos:
        condition: service_started
      servicio-logistica:
        condition: service_started
      servicio-logistica-mock:
        condition: service_started

  servicio-notificaciones:
    build:
      context: .
      dockerfile: ./servicio-notificaciones/Dockerfile
    image: ${DOCKERHUB_USER}/donatrack-notificaciones:latest
    platform: linux/amd64
    container_name: api-notificaciones
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/notificaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: notificaciones
      SPRING_DATASOURCE_PASSWORD: notificaciones
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_REMITENTE: ${BREVO_REMITENTE:-}
      BREVO_REMITENTE_NOMBRE: ${BREVO_REMITENTE_NOMBRE:-DonaTrack}
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  servicio-incentivos:
    build:
      context: .
      dockerfile: ./servicio-incentivos/Dockerfile
    image: ${DOCKERHUB_USER}/donatrack-incentivos:latest
    platform: linux/amd64
    container_name: api-incentivos
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/incentivos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: incentivos
      SPRING_DATASOURCE_PASSWORD: incentivos
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_BASE_URL: ${PUBLIC_URL}
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  servicio-logistica:
    build:
      context: .
      dockerfile: ./servicio-logistica/Dockerfile
    image: ${DOCKERHUB_USER}/donatrack-logistica:latest
    platform: linux/amd64
    container_name: api-logistica
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/logistica?authSource=admin&maxPoolSize=5
      LOGISTICA_CALLBACK_URL: ${PUBLIC_URL}/api/logistica/rutas
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC
    depends_on:
      mongo:
        condition: service_healthy

  servicio-logistica-mock:
    build:
      context: .
      dockerfile: ./servicio-logistica-mock/Dockerfile
    image: ${DOCKERHUB_USER}/donatrack-logistica-mock:latest
    platform: linux/amd64
    container_name: api-logistica-mock
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx64m -XX:MaxMetaspaceSize=96m -Xss512k -XX:+UseSerialGC

volumes:
  mysql-data:
  mongo-data:
  caddy-data:
  caddy-config:
