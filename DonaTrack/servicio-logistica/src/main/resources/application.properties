# Puerto del Servicio de Logística
server.port=8083

# Configuración de la Base de Datos (ejemplo con MySQL, cambialo si usan Postgres)
spring.datasource.url=jdbc:mysql://localhost:3306/donatrack_logistica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect