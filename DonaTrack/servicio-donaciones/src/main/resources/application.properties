server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/donatrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Límites de subida para la importación masiva de donantes por CSV (archivos de 10.000+ filas)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# URLs base de los demás servicios (integración HTTP)
services.notificaciones.url=http://localhost:8081
services.incentivos.url=http://localhost:8082
services.logistica.url=http://localhost:8083

# Cola de notificaciones RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:donatrack}

# Contacto de administración para notificaciones de entregas no satisfactorias
services.admin.contacto.medio=MAIL
services.admin.contacto.valor=admin@donatrack.org

# Enlace al mapa interactivo incluido en las notificaciones de logística
logistica.mapa.url=http://localhost:8080/mapa

# Polling de eventos de Logística (ms) y cron de inactividad de donantes
logistica.polling.intervalo-ms=60000
donaciones.inactividad.cron=0 0 9 * * ?
