# Puerto del Servicio de Notificaciones
server.port=8081

# Envio de mails (Brevo). Los valores sensibles vienen por variable de entorno.
notificaciones.email.api-url=https://api.brevo.com/v3/smtp/email
notificaciones.email.api-key=${BREVO_API_KEY:}
notificaciones.email.remitente=${BREVO_REMITENTE:}
notificaciones.email.remitente-nombre=${BREVO_REMITENTE_NOMBRE:DonaTrack}
notificaciones.email.asunto=${BREVO_ASUNTO:Notificacion de DonaTrack}

logging.level.org.donatrack=INFO
